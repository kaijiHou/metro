name: Fetch licensed tram sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public OpenStreetMap route relations
        run: python scripts/fetch-trams.py
      - uses: actions/upload-artifact@v4
        with:
          name: osm-tram-sources
          path: validation/tram-source/
          retention-days: 7
